<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Sanskruti ❤️</title>
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      height:100vh;
      font-family:Arial, sans-serif;
      text-align:center;
      color:white;
      overflow:hidden;
      background:url("https://images.pexels.com/photos/1024960/pexels-photo-1024960.jpeg") no-repeat center center/cover;
      position:relative;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    body::before{
      content:"";
      position:absolute;
      inset:0;
      background:rgba(0,0,0,0.55);
      z-index:0;
    }

    #startScreen,
    #intro,
    #main{
      position:relative;
      z-index:2;
    }

    #startScreen{
      background:rgba(0,0,0,0.55);
      padding:35px 28px;
      border-radius:24px;
      box-shadow:0 0 30px rgba(255,77,109,0.9);
      animation:startGlow 2s infinite alternate;
      max-width:90%;
    }

    @keyframes startGlow{
      from{box-shadow:0 0 15px rgba(255,77,109,0.7);}
      to{box-shadow:0 0 35px rgba(255,153,170,1);}
    }

    #startScreen h1{
      font-size:32px;
      margin-bottom:18px;
      text-shadow:0 0 12px rgba(255,255,255,0.6);
    }

    #startScreen p{
      font-size:18px;
      margin-bottom:22px;
      color:#ffe6eb;
    }

    #openBtn{
      padding:14px 30px;
      font-size:22px;
      border:none;
      border-radius:40px;
      background:linear-gradient(45deg,#ff4d6d,#ff99aa);
      color:white;
      cursor:pointer;
      box-shadow:0 0 18px rgba(255,153,170,0.9);
    }

    #intro{
      display:none;
      font-size:30px;
      font-weight:bold;
      padding:20px;
      max-width:90%;
      text-shadow:0 0 15px rgba(255,120,150,0.9);
    }

    .container{
      display:none;
      background:rgba(0,0,0,0.45);
      padding:40px 28px;
      border-radius:24px;
      max-width:430px;
      box-shadow:0 0 30px rgba(255,77,109,0.9);
      animation:glow 2s infinite alternate;
      backdrop-filter:blur(4px);
    }

    @keyframes glow{
      from{box-shadow:0 0 20px rgba(255,77,109,0.7);}
      to{box-shadow:0 0 45px rgba(255,153,170,1);}
    }

    .photo{
width:200px;
height:auto;
border-radius:18px;
margin-bottom:30px;
box-shadow:0 0 24px rgba(255,255,255,0.9);
border:2px solid rgba(255,255,255,0.7);
transform: rotate(90deg);
display:block;
margin-left:auto;
margin-right:auto;
}

    h1{
      margin-bottom:12px;
      font-size:34px;
    }

    .message{
      font-size:19px;
      line-height:1.6;
      color:#ffeef2;
      margin-bottom:18px;
    }

    .signature{
      margin-top:14px;
      font-size:22px;
      color:#ffd6de;
    }

    .button-wrap{
      position:relative;
      margin-top:22px;
      min-height:90px;
    }

    button{
      padding:12px 24px;
      font-size:18px;
      border:none;
      border-radius:30px;
      margin:10px;
      cursor:pointer;
      font-weight:bold;
    }

    #yes{
      background:#00ff95;
      color:#111;
      box-shadow:0 0 18px rgba(0,255,149,0.8);
    }

    #no{
      background:#ff4d4d;
      color:white;
      position:absolute;
      left:55%;
      top:0;
      box-shadow:0 0 18px rgba(255,77,77,0.8);
    }

    .heart{
      position:absolute;
      color:#ff6b8a;
      animation:float 6s linear infinite;
      pointer-events:none;
      z-index:1;
      text-shadow:0 0 10px rgba(255,255,255,0.7);
    }

    @keyframes float{
      0%{transform:translateY(100vh) scale(1);opacity:1;}
      100%{transform:translateY(-10vh) scale(1.4);opacity:0;}
    }

    .final-message{
      position:relative;
      z-index:10;
      font-size:42px;
      line-height:1.5;
      color:white;
      text-shadow:0 0 20px rgba(255,105,180,1);
      padding:20px;
    }
  </style>
</head>
<body>

  <div id="startScreen">
    <h1>💖 For Sanskruti 💖</h1>
    <p>I made something special for you...</p>
    <button id="openBtn" type="button">Tap to Open ❤️</button>
  </div>

  <div id="intro"></div>

  <div class="container" id="main">
    <img src="photo.jpg" class="photo" alt="Special Photo">

    <h1>Sanskruti ❤️</h1>

    <div class="message">
      I promise to love you forever.<br>
      You are the most special person in my life.<br>
      Every moment with you feels beautiful.<br>
      My heart feels close to you in the purest way.<br>
      Will you be a part of my life?
    </div>

    <div class="signature">– Siddhesh ❤️</div>

    <div class="button-wrap">
      <button id="yes" type="button">Yes ❤️</button>
      <button id="no" type="button">No 😅</button>
    </div>
  </div>

  <audio id="bgmusic" loop preload="auto">
    <source src="song.mp3" type="audio/mpeg">
  </audio>

  <script>
    const startScreen = document.getElementById("startScreen");
    const intro = document.getElementById("intro");
    const main = document.getElementById("main");
    const openBtn = document.getElementById("openBtn");
    const yesBtn = document.getElementById("yes");
    const noBtn = document.getElementById("no");
    const music = document.getElementById("bgmusic");

    let text = "Sanskruti... from the bottom of my heart, I want to tell you something very special ❤️";
    let i = 0;

    function typing(){
      if(i < text.length){
        intro.innerHTML += text.charAt(i);
        i++;
        setTimeout(typing, 75);
      } else {
        setTimeout(function(){
          intro.style.display = "none";
          main.style.display = "block";
        }, 1500);
      }
    }

    function showIntro(){
      startScreen.style.display = "none";
      intro.style.display = "block";
      intro.innerHTML = "";
      i = 0;
      typing();
    }

    function startExperience(){
      music.play().catch(function(){});
      showIntro();
    }

    function accepted(){
      document.body.innerHTML = `
        <div class="final-message">
          💍 Sanskruti ❤️<br>
          You made Siddhesh the happiest person alive!<br>
          I will love you forever ✨
        </div>
        <audio autoplay loop>
          <source src="song.mp3" type="audio/mpeg">
        </audio>
      `;
    }

    function moveButton(){
      const maxX = window.innerWidth - 140;
      const maxY = window.innerHeight - 80;
      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    openBtn.addEventListener("click", startExperience);
    openBtn.addEventListener("touchstart", startExperience);

    yesBtn.addEventListener("click", accepted);

    noBtn.addEventListener("mouseover", moveButton);
    noBtn.addEventListener("touchstart", function(e){
      e.preventDefault();
      moveButton();
    });

    setInterval(function(){
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (Math.random() * 25 + 15) + "px";
      document.body.appendChild(heart);

      setTimeout(function(){
        heart.remove();
      }, 6000);
    }, 300);
  </script>

</body>
</html>
